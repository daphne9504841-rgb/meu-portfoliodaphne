    <section class="bloco">
      <h1>Contato</h1>
      <p>Quer conversar ou deixar um recado? Preencha abaixo.</p>
      <form id="form-contato" class="form">
        <label>Nome <input name="nome" maxlength="100" required></label>
        <label>E-mail <input name="email" type="email" maxlength="150" required></label>
        <label>Mensagem <textarea name="mensagem" maxlength="1000" rows="5" required></textarea></label>
        <button class="btn" type="submit">Enviar mensagem</button>
        <p id="msg" role="status"></p>
      </form>
